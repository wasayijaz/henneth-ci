<!-- Henneth Desk mark — the small-size sibling of logo-terminal.svg.

     Same monitor, same green H_, but the front-bezel furniture is dropped: the "HENNETH DESK"
     label plate, its LED and the button housing all live in a 39px band of a 472px artboard, so
     anywhere under roughly 40px on screen they render as an unreadable smudge rather than as
     detail. Use logo-terminal.svg wherever the mark is large enough to earn them (splash, docs,
     print) and this one in the app chrome, where it sits at ~24px beside the text wordmark.
     Geometry is otherwise untouched — same viewBox, so the two are drop-in interchangeable. -->
