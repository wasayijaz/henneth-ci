<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Henneth Company Intelligence</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Henneth Company Intelligence">
        <span class="mark">H</span>
        <span><b>Henneth</b><small>Company Intelligence</small></span>
      </a>
      <div class="status">
        <span id="authState">Checking access</span>
        <button id="signOut" class="iconbtn" title="Sign out" aria-label="Sign out" hidden>Sign out</button>
      </div>
    </header>

    <main id="app" class="workspace">
      <section class="gate" aria-labelledby="gateTitle">
        <div>
          <p class="eyebrow">Private research workspace</p>
          <h1 id="gateTitle">Company context, one layer deeper.</h1>
          <p>Sign in with the existing Henneth account. This surface reads one private JSON file and keeps execution out of the product.</p>
        </div>
        <form id="loginForm" class="login">
          <label>Email<input id="email" type="email" autocomplete="email" required></label>
          <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
          <button type="submit">Sign in</button>
          <p id="loginMsg" class="muted">No signup here. Access is owner-only at the data gate.</p>
        </form>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
