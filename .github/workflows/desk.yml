name: PSX Desk

# Deterministic data desk (NO LLM agents -> zero token cost, zero secrets).
# Every 30 min during PSX hours: rebuild the state layer and publish the
# dashboard + data to GitHub Pages.
on:
  schedule:
    - cron: "0,30 4-11 * * 1-5"   # ~09:00-16:30 PKT, Mon-Fri
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # cache the 19-year deep history so it's fetched once/day, not every run
      - uses: actions/cache@v4
        with:
          path: state/history_deep
          key: deep-history-${{ github.run_id }}
          restore-keys: deep-history-

      - name: Data pipeline (deterministic, no agents)
        run: |
          set -e
          python scripts/update_universe.py
          python scripts/fetch_history.py
          python scripts/fetch_deep_history.py
          python scripts/fetch_dividends.py
          python scripts/fetch_fundamentals.py
          python scripts/score_fundamentals.py
          python scripts/build_calendar.py
          python scripts/quant.py
          python scripts/predictability.py
          python scripts/backtest.py
          python scripts/snapshot.py
          python scripts/fetch_intraday.py
          python scripts/fetch_global.py
          python scripts/fetch_georisk.py
          python scripts/tv_crosscheck.py || true
          python scripts/data_health.py
          python scripts/build_dashboard.py

      - name: Assemble Pages site (dashboard + state)
        run: |
          rm -rf _site && mkdir -p _site
          cp dashboard/index.html dashboard/app.js dashboard/themes.css _site/
          cp -r state _site/state
          echo "" > _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
