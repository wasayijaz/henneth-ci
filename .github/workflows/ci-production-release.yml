name: Henneth CI controlled production release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: henneth-ci-production-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Local CI contract and release contract
        run: |
          python scripts/check_ci_product_contracts.py
          python scripts/preflight.py
          python scripts/check_ci_release_integrity_receipt.py --self-test
          python scripts/check_ci_release_http_smoke.py --self-test
          python scripts/check_ci_vercel_deployment_commit.py --self-test

  preview:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Vercel credentials intentionally live only in this protected environment.
    # GitHub makes environment secrets available to the job that names it, so the
    # approval happens before the first provider action (the tested preview).
    environment: ci-production
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      deployment_id: ${{ steps.verify-preview.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Set release artifact cutoff
        run: echo "HENNETH_CI_BUILD_CUTOFF_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Finalize CI artifacts for this release commit
        env:
          HENNETH_CI_SOURCE_COMMIT_SHA: ${{ github.sha }}
        run: |
          python scripts/build_ci_artifact_integrity.py
          python scripts/check_ci_artifact_integrity.py
      - name: Deploy immutable CI preview
        id: deploy
        working-directory: Henneth Desk 2.CI.0
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_pAWpYAOOLZPwDFoqUeBguGIr
          VERCEL_PROJECT_ID: prj_6CYUpEbDTP0qIRl2U7XpaQrxeRrh
        run: |
          url="$(npx --yes vercel@59.9.1 deploy --yes --token="$VERCEL_TOKEN" --meta githubCommitSha="$GITHUB_SHA" --meta githubCommitRef="$GITHUB_REF_NAME" --meta githubCommitRepo="$GITHUB_REPOSITORY")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify preview is bound to this commit
        id: verify-preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_pAWpYAOOLZPwDFoqUeBguGIr
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: python scripts/check_ci_vercel_deployment_commit.py --deployment-url "$PREVIEW_URL" --commit-sha "$GITHUB_SHA"
      - name: Preview anonymous smoke
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: python scripts/check_ci_release_http_smoke.py --base-url "$PREVIEW_URL"

  promote:
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ci-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Promote the tested preview without rebuilding
        working-directory: Henneth Desk 2.CI.0
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_pAWpYAOOLZPwDFoqUeBguGIr
          VERCEL_PROJECT_ID: prj_6CYUpEbDTP0qIRl2U7XpaQrxeRrh
          PREVIEW_URL: ${{ needs.preview.outputs.url }}
        run: npx --yes vercel@59.9.1 promote "$PREVIEW_URL" --yes --token="$VERCEL_TOKEN"
      - name: Verify production is the promoted preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_pAWpYAOOLZPwDFoqUeBguGIr
          PREVIEW_DEPLOYMENT_ID: ${{ needs.preview.outputs.deployment_id }}
        run: python scripts/check_ci_vercel_deployment_commit.py --deployment-url https://ci.henneth.app --commit-sha "$GITHUB_SHA" --expected-deployment-id "$PREVIEW_DEPLOYMENT_ID"
      - name: Production owner and non-owner smoke
        env:
          HENNETH_CI_OWNER_SMOKE_EMAIL: ${{ secrets.HENNETH_CI_OWNER_SMOKE_EMAIL }}
          HENNETH_CI_OWNER_SMOKE_PASSWORD: ${{ secrets.HENNETH_CI_OWNER_SMOKE_PASSWORD }}
          HENNETH_CI_NON_OWNER_SMOKE_EMAIL: ${{ secrets.HENNETH_CI_NON_OWNER_SMOKE_EMAIL }}
          HENNETH_CI_NON_OWNER_SMOKE_PASSWORD: ${{ secrets.HENNETH_CI_NON_OWNER_SMOKE_PASSWORD }}
        run: python scripts/check_ci_release_http_smoke.py --base-url https://ci.henneth.app --require-authenticated
      - name: Create immutable release evidence artifact
        run: |
          python scripts/record_ci_release_integrity_receipt.py \
            --output "$RUNNER_TEMP/ci-release-integrity-receipt.json" \
            --commit-sha "$GITHUB_SHA" \
            --artifact-integrity-checked --ordinary-preflight-checked \
            --github-ci-success --github-workflow "Henneth CI controlled production release" --github-run-id "$GITHUB_RUN_ID" \
            --preview-ready --preview-url "${{ needs.preview.outputs.url }}" \
            --production-ready --production-url "https://ci.henneth.app" \
            --public-login-passed --public-login-url "https://ci.henneth.app" \
            --owner-private-data-200 --non-owner-private-data-403 \
            --private-data-url "https://ci.henneth.app/data/company_intelligence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-release-integrity-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/ci-release-integrity-receipt.json
          if-no-files-found: error
