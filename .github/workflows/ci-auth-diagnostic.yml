name: Henneth CI credential diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: ci-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check both credential pairs without deploying or changing accounts
        env:
          HENNETH_CI_OWNER_SMOKE_EMAIL: ${{ secrets.HENNETH_CI_OWNER_SMOKE_EMAIL }}
          HENNETH_CI_OWNER_SMOKE_PASSWORD: ${{ secrets.HENNETH_CI_OWNER_SMOKE_PASSWORD }}
          HENNETH_CI_NON_OWNER_SMOKE_EMAIL: ${{ secrets.HENNETH_CI_NON_OWNER_SMOKE_EMAIL }}
          HENNETH_CI_NON_OWNER_SMOKE_PASSWORD: ${{ secrets.HENNETH_CI_NON_OWNER_SMOKE_PASSWORD }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from check_ci_release_http_smoke import fetch_access_token
          failed = False
          for role in ('OWNER', 'NON_OWNER'):
              try:
                  fetch_access_token(os.environ[f'HENNETH_CI_{role}_SMOKE_EMAIL'], os.environ[f'HENNETH_CI_{role}_SMOKE_PASSWORD'])
                  print(f'{role}: password sign-in PASS')
              except AssertionError as exc:
                  failed = True
                  print(f'{role}: {exc}')
          raise SystemExit(1 if failed else 0)
          PY
