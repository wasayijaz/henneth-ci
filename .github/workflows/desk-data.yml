name: PSX Desk — deterministic data (cloud, 24/7)

# The CLOUD half of the hybrid. Runs the FREE, no-token deterministic pipeline on
# GitHub's servers so prices/quant/backtests/fair-value/health/dashboard stay fresh
# even when your computer is OFF. It does NOT run any LLM agent (no Claude, no API key,
# no Desk Room debate) — that is the app-scheduled half, which runs on your machine
# during market hours. This job only keeps the data layer alive; the agents' saved
# analysis (rooms.json, daily_read.json, etc.) is served 24/7 regardless.

on:
  workflow_dispatch: {}          # manual "Run workflow" button
  schedule:
    # Off-peak minutes (:07/:37) to dodge GitHub's on-the-hour congestion.
    # PKT = UTC+5. Covers pre-market through both Friday sessions (03:00–11:30 UTC = 08:00–16:30 PKT).
    - cron: "7,37 3-11 * * 1-5"

permissions:
  contents: write                # push refreshed state/ back to main (Vercel then auto-deploys)

concurrency:
  group: desk-data
  cancel-in-progress: false      # never interrupt a run mid-write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The full-universe reprice (threaded sweep of every ticker) plus preflight + publish
    # runs ~20-21min on a good day; Yahoo-latency variance pushed a real run past the old
    # 25min cap and GitHub killed it mid-sweep before it could commit. 40 gives headroom.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1         # persist-credentials defaults true → git push works with GITHUB_TOKEN
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Git identity
        run: |
          git config user.name  "psx-desk-bot"
          git config user.email "actions@github.com"
      - name: Deterministic pipeline (free, no agents)
        continue-on-error: true          # a mid-pipeline hiccup must not skip the gated publish
        env:
          # Optional server-only archive sink. Empty secrets leave supabase_ci_store.py in its
          # explicit no-op mode; neither value is available to the browser or committed state.
          HENNETH_CI_SUPABASE_URL: ${{ secrets.HENNETH_CI_SUPABASE_URL }}
          HENNETH_CI_SUPABASE_SERVICE_KEY: ${{ secrets.HENNETH_CI_SUPABASE_SERVICE_KEY }}
          HENNETH_CI_OWNER_USER_ID: ${{ secrets.HENNETH_CI_OWNER_USER_ID }}
        run: python scripts/run_cloud.py
      - name: Publish if the data passes preflight (race-safe)
        run: |
          # publish.py exits 0 both when it ships AND when nothing changed (quiet cycle),
          # and exits non-zero only on a real failure (preflight FAIL, commit/push error).
          # The old loop ended on `sleep 5`, so the STEP exited 0 even when all 3 tries
          # failed — masking preflight failures behind a green run. Track success and fail
          # the step loudly if publish never succeeded, so a stuck cycle is visible.
          published=0
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if python scripts/publish.py "Cloud data refresh (deterministic) $(date -u +%Y-%m-%d\ %H:%MZ)"; then
              published=1; break
            fi
            echo "publish attempt $i failed — retrying"; sleep 5
          done
          if [ "$published" -ne 1 ]; then
            echo "PUBLISH FAILED after 3 attempts — data NOT shipped this cycle"; exit 1
          fi
      - name: Watchdog — verify the live site (non-fatal)
        run: |
          sleep 60
          python scripts/watchdog.py || echo "WATCHDOG flagged the live site — see log above"
